name: Scheduled Yahoo Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "45 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: scheduled-yahoo-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify protected database secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL repository secret is required"
            exit 1
          fi

      - name: Install scheduled-ingestion runtime
        run: python -m pip install --disable-pip-version-check -e ".[postgres]"

      - name: Run bounded Yahoo ingestion
        run: python -m investment_manager.jobs.scheduled_yahoo
