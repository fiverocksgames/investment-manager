name: Python

on:
  pull_request:
    paths:
      - "investment_manager/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
      - ".github/workflows/fred-smoke.yml"
      - ".github/workflows/yahoo-smoke.yml"
      - ".github/workflows/ecos-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "investment_manager/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
      - ".github/workflows/fred-smoke.yml"
      - ".github/workflows/yahoo-smoke.yml"
      - ".github/workflows/ecos-smoke.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile package and tools
        run: python -m compileall -q investment_manager tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
